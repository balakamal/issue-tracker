    <!-- Open Graph (OG) Meta Tags for Crawlers -->
    <meta property="og:site_name" content="Issue Tracker" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://balakamal.github.io/issue-tracker/" />
    <meta property="og:title" content="Issue Tracker — Engineering Workspace" />
    <meta property="og:description" content="Collaborative engineering dashboard to track issues, enhancements, and tasks." />
    <meta property="og:image" content="https://balakamal.github.io/issue-tracker/og-banner.png" />

    <script>
      // Single Page Apps for GitHub Pages
      // MIT License - https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
