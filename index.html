<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Issue Tracker</title>
    <meta name="description" content="Issue Tracker — Collaborative engineering dashboard to track issues, enhancements, and tasks." />
    
    <!-- Open Graph (OG) Social Meta Tags -->
    <meta property="og:site_name" content="Issue Tracker" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Issue Tracker — Engineering Workspace" />
    <meta property="og:description" content="Collaborative engineering dashboard to track issues, enhancements, and tasks." />
    <meta property="og:image" content="/favicon.svg" />
    
    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Issue Tracker — Engineering Workspace" />
    <meta name="twitter:description" content="Collaborative engineering dashboard to track issues, enhancements, and tasks." />
    <meta name="twitter:image" content="/favicon.svg" />

    <!-- GitHub Pages Single Page App routing redirect handler -->
    <script>
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>

    <!-- Instant Theme Detection to prevent white flash -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('vantage_loop_theme_firebase_v3');
          if (!savedTheme) {
            savedTheme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', savedTheme);
        } catch (e) {}
      })();
    </script>

    <!-- Google Fonts: Urbanist & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <style>
      /* Pre-hydration instant loader */
      html, body {
        margin: 0;
        padding: 0;
        background-color: #0c1216;
      }
      html[data-theme="light"], html[data-theme="light"] body {
        background-color: #efefed;
      }
      #preloader-fallback {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        font-family: 'Urbanist', -apple-system, sans-serif;
      }
      .preloader-orbit {
        width: 60px;
        height: 60px;
        border-radius: 18px;
        background: linear-gradient(135deg, #0284c7, #2563eb);
        box-shadow: 0 0 32px rgba(37, 99, 235, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        animation: preloaderPulse 2s ease-in-out infinite;
      }
      @keyframes preloaderPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
      .preloader-text {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #79b6e3;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="preloader-fallback">
        <div class="preloader-orbit">
          <svg width="32" height="32" viewBox="0 0 40 40" fill="none">
            <circle cx="20" cy="20" r="10.5" stroke="rgba(255, 255, 255, 0.35)" stroke-width="2.5" />
            <path d="M20 9.5C25.8 9.5 30.5 14.2 30.5 20C30.5 25.8 25.8 30.5 20 30.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
            <path d="M15 20.5L18.5 24L25.5 16.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="28.5" cy="11.5" r="2.2" fill="#34D399" />
          </svg>
        </div>
        <div class="preloader-text">Issue Tracker</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
